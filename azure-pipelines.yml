stages:
- stage: Dev
  displayName: "Dev Stage"
  jobs:
  - deployment: DevDeploy
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:

          # ✅ STEP 1: Remove Phone 2 column
          - script: |
              echo "Removing Phone 2 column..."

              awk -F',' 'BEGIN{OFS=","} {
                for(i=1;i<=NF;i++){
                  if(i!=9) printf "%s%s",$i,(i==NF?"":OFS)
                }
                print ""
              }' $(System.DefaultWorkingDirectory)/customers-1000.csv > updated.csv

              mv updated.csv $(System.DefaultWorkingDirectory)/customers-1000.csv

              echo "Preview after change:"
              head -5 $(System.DefaultWorkingDirectory)/customers-1000.csv

            displayName: "Remove Phone 2 Column"

          # ✅ STEP 2: Upload updated file to storage
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'azure-conn'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az storage blob upload \
                  --account-name storageaccountrevs \
                  --container-name revannadev-uat-prod \
                  --name customers-1000.csv \
                  --file $(System.DefaultWorkingDirectory)/customers-1000.csv \
                  --auth-mode login
