trigger:
- main

stages:

- stage: Dev
  displayName: "Dev Stage"

  jobs:
    - job: DevJob
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - script: |
            echo "===== DEBUG START ====="
            pwd
            ls -R
            echo "===== DEBUG END ====="
          displayName: "Check Files"

        - task: AzureCLI@2
          inputs:
            azureSubscription: 'azure-conn'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              echo "Uploading file..."

              az storage blob upload \
                --account-name storageaccountrevs \
                --container-name revannadev-uat-prod \
                --name customers-1000-dev.csv \
                --file customers-1000.csv \
                --auth-mode login
