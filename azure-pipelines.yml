trigger:
- main

stages:

- stage: Dev
  displayName: "Dev Stage"
  jobs:
  - deployment: DevDeploy
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Deploying to DEV"

- stage: UAT
  displayName: "UAT Stage"
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - deployment: UATDeploy
    environment: UAT
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Deploying to UAT"

- stage: Prod
  displayName: "Prod Stage"
  dependsOn: UAT
  condition: succeeded()
  jobs:
  - deployment: ProdDeploy
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Deploying to PROD"
